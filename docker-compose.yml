services:
  postgres:
    image: postgres:16-alpine
    container_name: sawi-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: sawi_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sawi_secret}
      POSTGRES_DB: sawi_platform
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sawi_user -d sawi_platform"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sawi_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sawi-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://sawi_user:${POSTGRES_PASSWORD:-sawi_secret}@postgres:5432/sawi_platform
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    networks:
      - sawi_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: sawi-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - sawi_network

volumes:
  postgres_data:
  uploads_data:

networks:
  sawi_network:
    driver: bridge
